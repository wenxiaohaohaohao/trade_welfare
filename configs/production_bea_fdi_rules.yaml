source_rules:
  years: [2020, 2021, 2022, 2023, 2024]
  source_geography_field: country
  source_industry_field: industry
  source_area_type_field: bea_area_type
  source_parent_area_field: bea_parent_area
  canonical_aggregate_authority: country_crosswalk
  suppression_code: "(D)"
  small_value_code: "(*)"
  small_value_numeric_representation: 0.0
  suppressed_numeric_representation: missing
  analysis_strict_value_rule: sum_only_when_every_required_source_industry_is_disclosed
  disclosed_value_rule: sum_all_available_source_industry_values_for_diagnostics_only
  missing_country_direction_year_rule: do_not_materialize_or_impute
  aggregate_geography_rule: retain_in_source_long_exclude_from_analysis_long
  aggregate_sector_codes: [All industries, Manufacturing total]
  residual_sector_codes: [Other industries]
  proxy_source_industry: Transportation equipment
  proxy_analysis_sector: autos
  proxy_scope: proxy_robustness
  unsupported_analysis_sectors: [medical_devices, textiles_apparel]
  source_file_normalization: project_relative_forward_slash
  position_basis: historical_cost_end_of_year
  prohibit_total_fdi_formula: true

directions:
  us_direct_investment_abroad:
    order: 1
    foreign_country_role: affiliate_host_country
    origin_country_iso3: USA
    destination_country_iso3: foreign_country_iso3
    flow_sign_convention: outflows_positive_inflows_negative
    interpretation: united_states_direct_investment_abroad
  foreign_direct_investment_in_us:
    order: 2
    foreign_country_role: foreign_investor_country
    origin_country_iso3: foreign_country_iso3
    destination_country_iso3: USA
    flow_sign_convention: inflows_positive_outflows_negative
    interpretation: foreign_direct_investment_in_united_states

metrics:
  position:
    order: 1
    source_field: position
    raw_code_field: position_raw_code
    suppressed_field: position_suppressed
    small_value_field: position_small_value
    source_file_field: position_source_file
    source_url_field: position_source_url
    temporal_type: end_period_stock
    unit: current_million_usd
    frequency: annual
    formula: bea_direct_investment_position_historical_cost_basis
    use: external_financial_investment_stock_evidence
    sign_convention: source_reported_signed_position_no_recode
    can_sum_across_years: false
  flows:
    order: 2
    source_field: flows
    raw_code_field: flows_raw_code
    suppressed_field: flows_suppressed
    small_value_field: flows_small_value
    source_file_field: flows_source_file
    source_url_field: flows_source_url
    temporal_type: annual_flow
    unit: current_million_usd
    frequency: annual
    formula: bea_financial_transactions_without_current_cost_adjustment
    use: external_financial_investment_flow_evidence
    sign_convention: direction_specific_flow_convention
    can_sum_across_years: false
  income:
    order: 3
    source_field: income
    raw_code_field: income_raw_code
    suppressed_field: income_suppressed
    small_value_field: income_small_value
    source_file_field: income_source_file
    source_url_field: income_source_url
    temporal_type: annual_flow
    unit: current_million_usd
    frequency: annual
    formula: bea_direct_investment_income_without_current_cost_adjustment
    use: external_direct_investment_income_evidence
    sign_convention: source_reported_signed_income_no_recode
    can_sum_across_years: false

analysis_sector_components:
  electronics:
    scope: main
    source_industries: [Computers and electronic products]
  electrical_equipment:
    scope: main
    source_industries: ["Electrical equipment, appliances, and components"]
  machinery:
    scope: main
    source_industries: [Machinery]
  other_manufacturing:
    scope: main
    source_industries: [Chemicals, Food, Other manufacturing]
  autos:
    scope: proxy_robustness
    source_industries: [Transportation equipment]

