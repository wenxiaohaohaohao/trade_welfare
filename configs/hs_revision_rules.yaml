mapping_rules:
  canonical_conversion:
    method: official_unsd_conversion
    weight: 1.0
    purpose: Main no-expansion mapping from each source-revision HS6 to one HS2012 code.
  full_correlation:
    method: official_unsd_correlation
    purpose: Audit and robustness only.
    multi_target_weight: null
    prohibition: Do not aggregate values through multi-target correlations until a value-based weighting rule is built and validated.

analysis_hs2012_overrides:
  271012: 271000
  271019: 271000
  271020: 271000
  271091: 271000
  271099: 271000
  note: CEPII BACI uses the documented aggregate 271000 in place of the five official HS2012 petroleum-oil subheadings; this is a many-to-one analysis-code collapse, not an equal split.

source_code_overrides:
  HS2017:
    271000:
      target_hs2012: 271000
      method: configured_cepii_aggregate_identity
      reason: CEPII BACI HS2017 and the project Section 301 universe contain the CEPII aggregate code 271000 although it is not an official HS2017 subheading.

census_unmatched_rules:
  exact_hs2012_fallback: true
  fallback_reason: U.S. HTS implementation retains some prior-revision six-digit codes in particular years; use an exact HS2012 identity only when the same code exists in the official/local HS2012 universe.
  excluded_prefixes: ["98", "99"]
  excluded_reason: U.S. national special-classification and low-value estimate codes are outside the internationally comparable HS product universe.
  unresolved_rule: Retain the code and value with unresolved_nonstandard_code status; do not force a false HS6 match.
