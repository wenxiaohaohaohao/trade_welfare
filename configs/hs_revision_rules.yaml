version: hs_revision_rules_v1
status: frozen_for_m1
frozen_date: 2026-07-19
analysis_revision: HS2012

source_revision_rules:
  baci_hs6_panel:
    revision: HS2012
    code_field: hs6
  baci_hs17_us_imports_2017:
    revision: HS2017
    code_field: hs6
  section301_hs6_exposure:
    revision: HS2017
    code_field: hs6
  us_census_hs6_monthly:
    code_field: hs6
    retain_fields: [year, month, hts10]
    year_bands:
      - {start: 2014, end: 2016, revision: HS2012}
      - {start: 2017, end: 2021, revision: HS2017}
      - {start: 2022, end: 2024, revision: HS2022}
    interpretation: The first six HTS digits follow the HS edition in force for that year; HTS10 remains a year-specific U.S. national code and is never treated as a stable international product identifier.
  section301_2024_review_hts10:
    revision: HTS2024
    code_field: hts10
    treatment: separate_extension
    interpretation: Keep exact 2024 HTS10 review lines separate until a validated HTS10-to-HS6 bridge is explicitly applied.

