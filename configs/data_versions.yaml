baci:
  source: CEPII BACI
  version: 202601
  release_date: 2026-01-22
  raw_dir: data/raw/BACI_HS12_V202601/
  status: ready_for_batch1_raw_csv
  csv_pattern: BACI_HS12_Y{year}_V202601.csv
  country_metadata: country_codes_V202601.csv
  product_metadata: product_codes_HS12_V202601.csv
  readme: Readme.txt
  coverage:
    years:
      start: 2012
      end: 2024
    products:
      nomenclature: HS12
      level: HS6
      count: 5202
    value_unit: thousand_usd
    quantity_unit: metric_tons
    raw_columns:
      t: year
      i: exporter_country_code
      j: importer_country_code
      k: hs6_product_code
      v: value_thousand_usd
      q: quantity_metric_tons
  known_issue:
    taiwan: BACI metadata does not contain TWN directly; code 490 is country_iso3 S19 and country_name Other Asia, nes.
    quantity: q has missing values for some flows; value-based connector measures should not require q.
  legacy_local_file:
    raw_file: data/raw/baci.dta
    version: local_stata_extract_unknown
    status: not_sufficient_for_batch1
    years:
      start: 2000
      end: 2014
    rows: 134345413
    known_issue: file has 16 trailing rows with missing year; downstream reads must filter nonmissing year, hs6, value, exporter, and importer.
  batch1_usage:
    use_raw_csv: true
    required_years:
      start: 2014
      end: 2024
    output_dir: data/interim/trade/
    value_transform: trade_value_usd = v * 1000
    hs6_transform: preserve k as a six-character string
    country_transform: map numeric i and j through country_codes_V202601.csv to ISO3
    source_file_transform: set source_file to the raw CSV filename
  section301_denominator:
    version: BACI_HS17_V202601
    source_url: https://www.cepii.fr/DATA_DOWNLOAD/baci/data/BACI_HS17_V202601.zip
    raw_dir: data/raw/BACI_HS17_V202601/
    year: 2017
    nomenclature: HS2017
    output: data/interim/trade/baci_hs17_us_imports_2017.parquet
    value_transform: trade_value_usd = v * 1000
    purpose: China and total USA import shares on the same HS2017 basis as the Section 301 pre-policy tariff codes

oecd_icio:
  source: OECD ICIO 2025 edition
  raw_dir: data/raw/oecd_icio/
  status: pending_download

oecd_amne:
  source: OECD Analytical AMNE
  raw_dir: data/raw/oecd_amne/
  status: built_affiliate_activity_mp_shares
  raw_subdirs:
    analytical_amne: data/raw/oecd_amne/analytical_amne/
    metadata: data/raw/oecd_amne/metadata/
  coverage:
    activity_years:
      start: 2008
      end: 2023
    bilateral_output_years:
      start: 2000
      end: 2024
    countries_plus_row: 81
    sectors: 41
    unit: current million USD
  batch4_usage:
    output_dir: data/interim/mne/
    outputs:
      affiliate_activity: data/interim/mne/oecd_amne_affiliate_activity.parquet
      mp_shares: data/interim/mne/oecd_amne_mp_shares.parquet
    construction:
      affiliate_output: off-diagonal parent-host-sector cells from aamne-bilateral-output.csv
      foreign_affiliate_share: foreign affiliate output divided by total gross output by host-sector-year
      mpe_expansion: year-over-year change in total foreign affiliate output by host-sector
      employment: not available in downloaded OECD Analytical AMNE files; retained as null column

us_census:
  source: U.S. Census USA Trade Online / International Trade API
  api_base: https://api.census.gov/data/timeseries/intltrade/imports/hs
  api_key_env: CENSUS_API_KEY
  raw_dir: data/raw/us_census/
  status: built_2014_2024_hs10_hs6_monthly
  raw_subdirs:
    hs10_monthly_imports: data/raw/us_census/hs10_monthly_imports/
    hs6_monthly_imports: data/raw/us_census/hs6_monthly_imports/
    metadata: data/raw/us_census/metadata/
  api_fields:
    YEAR: year
    MONTH: month
    CTY_CODE: origin_census_code
    CTY_NAME: origin_name
    I_COMMODITY: hts10_or_hs6
    I_COMMODITY_SDESC: commodity_description
    GEN_VAL_MO: import_value_usd
    GEN_QY1_MO: quantity
    UNIT_QY1: quantity_unit
    CON_VAL_MO: customs_value
    CAL_DUT_MO: duties
    DUT_VAL_MO: dutiable_value_usd
  coverage:
    frequency: monthly
    first_api_year: 2013
    commodity_levels:
      - HS10
      - HS6
  batch2_usage:
    required_years:
      start: 2014
      end: 2024
    output_dir: data/interim/trade/
    outputs:
      hs10_monthly: data/interim/trade/us_imports_hs10_monthly.parquet
      hs6_monthly: data/interim/trade/us_imports_hs6_monthly.parquet
    country_scope: source_bloc plus connector candidates and comparators from configs/country_groups.yaml
    api_key_rule: Read from CENSUS_API_KEY; never write the API key to tracked files.

ustr_section301:
  source: USTR Section 301 China tariff actions and official exclusion/four-year review notices
  raw_dir: data/raw/ustr_section301/
  status: official_base_list_code_table_built; hts10_panel_ready; hs6_exposure_uses_baci_hs2017_and_census_china_weights; exact_2024_review_table_built_separately
  source_rule: official USTR, Federal Register/govinfo, and CBP sources only for the first version
  source_pages:
    master: https://ustr.gov/issue-areas/enforcement/section-301-investigations/tariff-actions
    list1: https://ustr.gov/issue-areas/enforcement/section-301-investigations/section-301-china/34-billion-trade-action
    list2: https://ustr.gov/issue-areas/enforcement/section-301-investigations/section-301-china/16-billion-trade-action
    list3: https://ustr.gov/issue-areas/enforcement/section-301-investigations/section-301-china/200-billion-trade-action
    list4: https://ustr.gov/issue-areas/enforcement/section-301-investigations/section-301-china/300-billion-trade-action
    four_year_review: https://ustr.gov/trade-topics/enforcement/section-301-investigations/section-301-china-technology-transfer/china-section-301-tariff-actions-and-exclusion-process/four-year-review
    machinery_exclusions: https://ustr.gov/issue-areas/enforcement/section-301-investigations/section-301-china-technology-transfer/china-section-301-tariff-actions-and-exclusion-process/machinery-exclusions-process
  raw_subdirs:
    list1: data/raw/ustr_section301/list1/
    list2: data/raw/ustr_section301/list2/
    list3: data/raw/ustr_section301/list3/
    list4: data/raw/ustr_section301/list4/
    exclusions: data/raw/ustr_section301/exclusions/
    machinery_exclusions: data/raw/ustr_section301/exclusions/machinery/
    four_year_review: data/raw/ustr_section301/four_year_review/
    metadata: data/raw/ustr_section301/metadata/
  batch2_usage:
    output_dir: data/interim/policy/
    notice_code_table: data/raw/ustr_section301/metadata/section301_notice_codes.csv
    notice_code_audit: data/raw/ustr_section301/metadata/section301_notice_code_build_audit.json
    hts10_universes:
      list1: data/raw/usitc_hts/2018/hts_2018_revision_8.csv
      list2: data/raw/usitc_hts/2018/hts_2018_revision_10_data.csv
      # List 3 keeps a 2017 fallback only for the 14 Chapter 44 subheadings
      # replaced on 2018-10-01; this preserves the pre-policy exposure basis.
      list3:
        - data/raw/usitc_hts/2018/hts_2018_revision_12_data.csv
        - data/raw/usitc_hts/2017/hts_2017_preliminary_csv.csv
      list4a: data/raw/usitc_hts/2019/hts_2019_revision_12_data.csv
    census_hs10_imports: data/interim/trade/us_imports_hs10_2017_full_origin.parquet
    china_hs10_imports: data/interim/trade/us_imports_hs10_monthly.parquet
    baci_hs6_imports: data/interim/trade/baci_hs17_us_imports_2017.parquet
    exposure_input_priority:
      - full_census_hs10
      - baci_hs2017_with_census_china_hts10_weights
    exposure_year: 2017
    origin_iso3: CHN
    destination_iso3: USA
    outputs:
      hts10_list_panel: data/interim/policy/section301_hts10_list_panel.parquet
      hs6_exposure: data/interim/policy/section301_hs6_exposure.parquet
      review_2024_modern_hts: data/interim/policy/section301_2024_review_codes.parquet
    review_2024_usage_rule: keep separate from the HS2017 exposure panel unless a scope-aware HS2022-to-HS2017 treatment is explicitly applied
    exposure_formula: tariff_exposure = china_import_share_2017 * tariff_rate

mexico_fdi:
  source: Secretaria de Economia, datos.gob.mx and Data Mexico
  status: downloaded_normalized_validated
  snapshot_date: "2026-07-18"
  portal_dataset_page: https://www.datos.gob.mx/dataset/inversion_extranjera_directa
  api_url: https://www.economia.gob.mx/datamexico/api/data
  raw_dir: data/raw/mexico_fdi/
  output_dir: data/interim/fdi/
  coverage:
    national_quarterly: 1999Q1-2024Q4
    national_investment_type_quarterly: 1999Q1-2024Q4
    parent_country_annual: 1999-2024
    sector_annual: 1999-2024
    detailed_cross_tables: 2006Q1-2024Q4
  confidentiality_rule: C is retained as null with confidential_flag=true; disaggregated tables are not additive to national totals
  aggregate_country_rule: exclude parent_country_total_flag=true before summing individual parent countries
  outputs:
    national_quarterly: data/interim/fdi/mexico_fdi_national_quarterly.parquet
    national_investment_type_quarterly: data/interim/fdi/mexico_fdi_national_investment_type_quarterly.parquet
    parent_country_annual: data/interim/fdi/mexico_fdi_parent_country_annual.parquet
    sector_annual: data/interim/fdi/mexico_fdi_sector_annual.parquet
    country_sector_quarterly: data/interim/fdi/mexico_fdi_country_sector_quarterly.parquet
    country_investment_type_quarterly: data/interim/fdi/mexico_fdi_country_investment_type_quarterly.parquet
    state_country_quarterly: data/interim/fdi/mexico_fdi_state_country_quarterly.parquet
    state_sector_quarterly: data/interim/fdi/mexico_fdi_state_sector_quarterly.parquet
    state_investment_type_quarterly: data/interim/fdi/mexico_fdi_state_investment_type_quarterly.parquet
    summary: data/interim/fdi/mexico_fdi_build_summary.json

fdi_markets:
  status: excluded_from_current_batch_by_user_instruction
  processing_rule: do_not_download_or_process_in_this_batch

bea_mne:
  source: BEA Activities of U.S. MNEs
  raw_dir: data/raw/bea_mne/
  status: built_batch5_affiliate_country_industry
  existing_local_dir: data/raw/bea_usdia_mofas_2025-08/
  raw_subdirs:
    activities_us_mnes: data/raw/bea_mne/activities_us_mnes/
    metadata: data/raw/bea_mne/metadata/
  coverage:
    years:
      start: 2017
      end: 2023
    ownership_scope: majority-owned foreign affiliates of U.S. MNEs
    geography: BEA affiliate country or area rows; filter bea_area_type for country-only use
    industry: BEA industry of affiliate country-by-industry tables
  batch5_usage:
    output_dir: data/interim/mne/
    output: data/interim/mne/bea_us_mne_affiliate_country_industry.parquet
    build_summary: data/interim/mne/bea_us_mne_affiliate_country_industry_build_summary.json
    metadata_manifest: data/raw/bea_mne/metadata/bea_us_mne_activities_manifest.json
    minimum_fields:
      - year
      - affiliate_country
      - industry
      - employment
      - sales
      - value_added
      - capital_expenditures
      - goods_exports_to_us
      - goods_imports_from_us
    source_tables:
      employment: BEA Table II.G 1
      sales: BEA Table II.D 3
      value_added: BEA Table II.F 3
      capital_expenditures: BEA Table II.C 4
      goods_exports_to_us: BEA Table II.H 11, U.S. imports of goods shipped by affiliates
      goods_imports_from_us: BEA Table II.H 3, U.S. exports of goods shipped to affiliates
    suppression_rule: BEA (D) cells and employment size-range codes A/F/G/H/I/J/K/L/M are missing, not zero; (*) cells are rounded small values set to 0.0 with a flag.
    current_limit: Full six-field C/D/F/G/H panel is built for 2017-2023; earlier years can be added later if needed after separately downloading and validating older BEA annual files.

bea_fdi:
  source: BEA Direct Investment by Country and Industry
  raw_dir: data/raw/bea_fdi/
  status: built_batch6_direct_investment_country_industry
  raw_subdirs:
    direct_investment_country_industry: data/raw/bea_fdi/direct_investment_country_industry/
    metadata: data/raw/bea_fdi/metadata/
  coverage:
    years:
      start: 2020
      end: 2024
    directions:
      - us_direct_investment_abroad
      - foreign_direct_investment_in_us
    geography: BEA country or area rows; filter bea_area_type for country-only use
    industry: BEA selected country-by-industry columns
    unit: millions of dollars
  batch6_usage:
    output_dir: data/interim/fdi/
    output: data/interim/fdi/bea_direct_investment_country_industry.parquet
    build_summary: data/interim/fdi/bea_direct_investment_country_industry_build_summary.json
    metadata_manifest: data/raw/bea_fdi/metadata/bea_direct_investment_country_industry_manifest.json
    minimum_fields:
      - year
      - direction
      - country
      - industry
      - position
      - flows
      - income
      - source_file
    source_pages:
      main: https://www.bea.gov/data/intl-trade-investment/direct-investment-country-and-industry
      us_direct_investment_abroad: https://www.bea.gov/international/di1usdbal
      foreign_direct_investment_in_us: https://www.bea.gov/international/di1fdibal
    source_tables:
      position: Direct investment position on a historical-cost basis
      flows: Financial transactions without current-cost adjustment
      income: Direct investment income without current-cost adjustment
    suppression_rule: BEA (D) cells are missing, not zero; BEA (*) cells are stored as 0.0 with a small-value flag.
    current_limit: Default output is restricted to 2020-2024 because all three minimum indicators are jointly available for both directions. BEA pages also list 2025 position files, but matching 2025 annual flows and income are not included in this batch. If the project later needs a longer window or earlier historical years, extend this through a separate BEA download and validation batch.
