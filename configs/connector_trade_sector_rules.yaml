    zero_source_product_count_field: east_asia_to_connector_zero_source_product_count
    excluded_value_field: east_asia_to_connector_excluded_value_usd
    included_share_field: east_asia_to_connector_included_value_share
  connector_to_usa:
    value_field: connector_to_usa_value_usd
    source_row_count_field: connector_to_usa_value_usd_row_count
    positive_product_count_field: connector_to_usa_positive_product_count
    zero_source_product_count_field: connector_to_usa_zero_source_product_count
