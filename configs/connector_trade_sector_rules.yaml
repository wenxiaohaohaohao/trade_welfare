    path: data/processed/harmonized/connector_trade_hs6_year.parquet
    sha256: 01fbbe43a8e067ed165d21f72d3b733fe240ec098957e99085fff67b16571fdb
    expected_rows: 743886
    natural_key: [connector_iso3, analysis_hs6, year]
  product_sector_crosswalk:
    path: data/processed/concordances/product_sector_crosswalk.parquet
    sha256: 201c1d47ee861fe300db1574b6e80288bbeaec17e19fe4d368205b6d84995c09
    expected_rows: 5202
    natural_key: [analysis_hs6]

join:
  keys: [analysis_hs6]
  type: left
  cardinality: many_to_one
  require_all_products_matched: true
  require_embedded_fields_identical: true

eligibility:
  flag: is_analysis_sector_eligible
  required_value: true
  weight_field: sector_mapping_weight
  required_weight: 1.0
  excluded_statuses:
    - first_round_excluded
    - outside_manufacturing
    - residual_product

analysis:
  connectors:
    - CAN
    - IDN
    - IND
    - KOR
    - MAR
    - MEX
    - MYS
    - PHL
    - POL
    - THA
    - TUR
    - TWN
    - VNM
  years:
    start: 2014
    end: 2024
  sectors:
    autos: 64
    electrical_equipment: 177
    electronics: 252
    machinery: 467
    medical_devices: 32
    other_manufacturing: 2422
    textiles_apparel: 823
  expected_input_products: 5202
  expected_eligible_products: 4237
  expected_excluded_products: 965
  expected_output_rows: 1001
  expected_zero_denominator_eligible_products: 17
  expected_no_hs17_mapping_eligible_products: 11

trade_flows:
