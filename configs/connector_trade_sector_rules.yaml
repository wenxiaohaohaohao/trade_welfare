  mapped_status: mapped_hs17_import_weighted
  zero_denominator_status: mapped_hs17_no_2017_import_denominator
  no_mapping_status: no_hs17_baci_weight_mapping
  total_import_field: total_us_import_value_2017
  china_import_field: china_import_value_2017
  china_weighted_rate_field: tariff_rate_china_weighted
  tariffed_product_field: tariffed_product
