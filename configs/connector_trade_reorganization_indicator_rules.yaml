analysis:
  connectors:
    - CAN
    - IDN
    - IND
    - KOR
    - MAR
    - MEX
    - MYS
    - PHL
    - POL
    - THA
    - TUR
    - TWN
    - VNM
  sectors:
    - autos
    - electrical_equipment
    - electronics
    - machinery
    - medical_devices
    - other_manufacturing
    - textiles_apparel
  eligible_products_by_sector:
    autos: 64
    electrical_equipment: 177
    electronics: 252
    machinery: 467
    medical_devices: 32
    other_manufacturing: 2422
    textiles_apparel: 823
  expected_eligible_product_count: 4237
  expected_product_rows: 55081
  expected_sector_rows: 91
  expected_comovement_rows: 91

windows:
  pre:
    start: 2014
    end: 2017
    expected_year_count: 4
  post:
    start: 2020
    end: 2024
    expected_year_count: 5
  level_rule: arithmetic_mean_of_complete_annual_product_observations

trade_flows:
  - china_to_connector
  - east_asia_to_connector
  - connector_to_usa
  - china_to_usa

replacement:
  china_us_decline_formula: max_china_us_pre_minus_post_zero
  connector_us_gain_formula: connector_us_post_minus_pre_signed
  denominator_threshold_usd: 25000000
  denominator_operator: strictly_greater_than
  ratio_formula: signed_connector_us_gain_divided_by_china_us_decline
  numerator_not_truncated: true
  arbitrary_epsilon_prohibited: true
  capped_ratio_constructed: false

source_export_ratios:
  denominator: connector_to_usa_value_usd
  denominator_operator: strictly_positive
  source_definitions:
    china: china_to_connector_value_usd
    east_asia: east_asia_to_connector_value_usd
  arbitrary_epsilon_prohibited: true

product_comovement:
  source_definitions:
    china: china_to_connector
    east_asia: east_asia_to_connector
  export_flow: connector_to_usa
  china_us_benchmark_flow: china_to_usa
  active_product_rule: source_pre_plus_post_plus_export_pre_plus_post_strictly_positive
  product_share_denominators:
    eligible: all_sector_eligible_products
    active: source_specific_active_products
  value_share_denominator: sum_positive_connector_export_gain_usd
  correlation:
    method: pearson
    minimum_active_product_count: 20
    weighted_pre_value_formula: source_input_pre_plus_connector_export_pre
    minimum_positive_weight_product_count: 20
    undefined_if_zero_variance: true
  conditions:
    both_legs_positive: source_input_change_gt_zero_and_connector_export_change_gt_zero
    rerouting: china_us_change_lt_zero_and_connector_export_change_gt_zero
    triple: china_us_change_lt_zero_and_source_input_change_gt_zero_and_connector_export_change_gt_zero

exposure_overlap:
  policy_reference_window: post
  tariffed_product_measure: mean_post_year_tariffed_status
  tariffed_product_flag_rule: post_year_share_gt_zero
  product_exposure_measure: mean_post_year_tariff_exposure
  missing_exposure_rule: preserve_missing_and_exclude_from_exposure_weighted_denominator
  weighted_exposure_formula: sum_connector_export_value_times_product_exposure_divided_by_observed_exposure_export_value
  observed_value_coverage_required: true
  high_exposure_definitions:
    positive:
      rule: observed_product_exposure_gt_zero
    top_quartile:
      percentile: 0.75
      quantile_rule: linear_type_7
      reference_group: positive_exposure_products_within_analysis_sector
      rule: observed_positive_exposure_ge_sector_p75
  gain_share_denominator: positive_connector_export_gain_with_observed_exposure
  expected_product_counts_by_sector:
    autos:
      tariffed: 63
      exposure_observed: 64
      exposure_missing: 0
      positive_exposure: 59
      top_quartile_positive_exposure: 15
    electrical_equipment:
      tariffed: 161
      exposure_observed: 177
      exposure_missing: 0
      positive_exposure: 161
      top_quartile_positive_exposure: 41
    electronics:
      tariffed: 235
      exposure_observed: 251
      exposure_missing: 1
      positive_exposure: 222
      top_quartile_positive_exposure: 56
    machinery:
      tariffed: 458
      exposure_observed: 465
      exposure_missing: 2
      positive_exposure: 452
      top_quartile_positive_exposure: 113
    medical_devices:
      tariffed: 16
      exposure_observed: 32
      exposure_missing: 0
      positive_exposure: 16
      top_quartile_positive_exposure: 4
    other_manufacturing:
      tariffed: 2240
      exposure_observed: 2397
      exposure_missing: 25
      positive_exposure: 1934
      top_quartile_positive_exposure: 484
    textiles_apparel:
      tariffed: 798
      exposure_observed: 823
      exposure_missing: 0
      positive_exposure: 780
      top_quartile_positive_exposure: 195
  expected_missing_exposure_product_count: 28
  expected_tariffed_missing_exposure_product_count: 14
  expected_fractional_post_tariff_status_count: 0

