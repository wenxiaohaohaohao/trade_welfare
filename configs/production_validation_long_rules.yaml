    foreign_affiliate_output_total: affiliate_output
    foreign_affiliate_value_added_total: affiliate_value_added
    foreign_affiliate_exports_total: affiliate_trade_flow
    foreign_affiliate_imports_total: affiliate_trade_flow
    gross_output: production_output
    foreign_affiliate_output_share: ratio
  bea_mne:
    employment: employment
    sales: affiliate_sales
    value_added: affiliate_value_added
    capital_expenditures: capital_expenditure
    goods_exports_to_us: affiliate_trade_flow
    goods_imports_from_us: affiliate_trade_flow
  bea_fdi:
    position: direct_investment_stock
    flows: direct_investment_flow
    income: direct_investment_income
  mexico_fdi:
    fdi_flow: direct_investment_flow

