integration_rules:
  preserve_every_input_observation_once: true
  source_observation_id_algorithm: sha256_of_source_table_and_canonical_natural_key_json
  country_role_required: true
  never_sum_across_sources: true
  never_sum_across_metrics: true
  never_impute_missing_or_suppressed_or_confidential: true
  never_interpolate_icio_years: true
  source_audit_tables_excluded_from_concat: true
  main_host_activity_sources: [icio_analysis, amne_host_sector, bea_mne_analysis]
  financial_sources: [bea_fdi_analysis, mexico_parent_sector_period, mexico_benchmark_period]
  main_host_activity_rule: icio_and_amne_all_rows_plus_bea_mne_main_scope_only
  bea_fdi_rule: retain_as_financial_evidence_and_preserve_direction_and_country_role
  mexico_parent_rule: retain_parent_origin_dimension_and_never_treat_parent_as_host
  mexico_benchmark_rule: national_totals_are_country_period_benchmarks_not_sector_rows
  proxy_rule: retain_in_full_registry_and_exclude_from_main_host_activity_output

metric_families:
  icio:
    gross_output: production_output
    value_added: value_added
    exports: trade_flow
    imports: trade_flow
    intermediate_inputs: accounting_input
