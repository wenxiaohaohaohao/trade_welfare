    source_filter: oecd_icio
    expected_filtered_rows: 81

source_contract:
  source_name: icio
  source_crosswalk_name: oecd_icio
  release: OECD ICIO 2025 edition regular tables
  unit: current_million_usd
  frequency: annual
  direct_or_allocated: direct
  observed_years: [2017, 2018, 2022]
  interpolate_missing_years: false
  country_rule: keep_all_81_geographies_in_source_long_but_only_is_country_true_in_analysis_long
  row_aggregate_code: ROW
  row_aggregate_is_not_country: true
  sector_rule: keep_all_50_sectors_in_source_long_but_only_weight_1_main_join_eligible_manufacturing_in_analysis_long
  medical_devices_separate_measure_available: false
  source_sector_mapping_version: source_sector_rules_v1

analysis_sectors:
  - electronics
  - electrical_equipment
  - machinery
  - autos
  - textiles_apparel
  - other_manufacturing

metrics:
  gross_output:
    order: 1
    source_field: gross_output
    formula: sum_production_side_OUT_over_eligible_source_sectors
    derivation_status: source_direct_then_sector_sum
    use: production_level
    accounting_negative_allowed: false
  value_added:
    order: 2
    source_field: value_added
    formula: sum_VA_row_over_eligible_source_sectors
    derivation_status: source_direct_then_sector_sum
    use: production_validation
    accounting_negative_allowed: true
  exports:
    order: 3
    source_field: exports
    formula: sum_intermediate_and_final_demand_absorbed_by_foreign_destinations_over_eligible_source_sectors
    derivation_status: source_matrix_derived_then_sector_sum
    use: source_consistent_export_level
    accounting_negative_allowed: false
  imports:
    order: 4
    source_field: imports
    formula: sum_absorption_from_foreign_origins_in_same_source_sector_over_eligible_source_sectors
    derivation_status: source_matrix_derived_then_sector_sum
    use: source_consistent_import_level
    accounting_negative_allowed: false
  intermediate_inputs:
    order: 5
    source_field: intermediate_inputs
    formula: sum_global_intermediate_inputs_used_by_producing_sector_over_eligible_source_sectors
    derivation_status: source_matrix_derived_then_sector_sum
    use: input_output_intensity
    accounting_negative_allowed: false
  taxes_less_subsidies:
    order: 6
    source_field: taxes_less_subsidies
    formula: sum_TLS_row_over_eligible_source_sectors
    derivation_status: source_direct_then_sector_sum
    use: production_accounting_component
    accounting_negative_allowed: true
  accounting_residual:
    order: 7
    source_field: production_accounting_residual
    formula: gross_output_minus_intermediate_inputs_minus_taxes_less_subsidies_minus_value_added
    derivation_status: derived_accounting_diagnostic_then_sector_sum
    use: quality_diagnostic_not_economic_outcome
    accounting_negative_allowed: true

formulas:
  production_accounting_residual: gross_output_minus_intermediate_inputs_minus_taxes_less_subsidies_minus_value_added
  sales_accounting_residual: gross_output_sales_minus_intermediate_sales_minus_final_demand
  analysis_sector_value: sum_source_sector_values_where_country_is_country_and_sector_is_main_join_eligible_and_mapping_weight_equals_1
  prohibited_operations:
    - interpolate_2019_or_other_missing_icio_years
    - fabricate_medical_devices_from_C26_or_C31T33
    - treat_ROW_as_country
    - sum_different_metric_names
    - replace_negative_value_added_taxes_or_accounting_residual_with_zero

