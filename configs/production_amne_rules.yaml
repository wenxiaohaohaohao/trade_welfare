source_contract:
  source_name: amne
  source_crosswalk_name: oecd_amne
  release: OECD Analytical AMNE 2026 release
  unit: current_million_usd
  frequency: annual
  observed_years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
  host_country_count_in_source: 81
  parent_country_count_in_source: 81
  actual_country_count: 80
  foreign_parents_per_host: 80
  row_aggregate_code: ROW
  parent_detail_universe: positive_affiliate_output_links_only
  zero_parent_links_materialized_in_parent_detail: false
  host_totals_use_full_zero_inclusive_mp_share_universe: true
  bilateral_output_status: direct
  parent_value_added_exports_imports_status: allocated_by_parent_affiliate_output_share
  employment_status: unavailable
  parent_share_denominator: sum_bilateral_affiliate_output_over_all_foreign_parents
  host_foreign_output_status: direct_xvem_total
  medical_devices_separate_measure_available: false
  source_sector_mapping_version: source_sector_rules_v1
  auxiliary_zero_only_source_sectors:
    O84:
      status: outside_manufacturing_auxiliary_zero_only
      main_join_eligible: false
    T97T98:
      status: outside_manufacturing_auxiliary_zero_only
      main_join_eligible: false

analysis_sectors:
  - electronics
  - electrical_equipment
  - machinery
  - autos
  - textiles_apparel
  - other_manufacturing

parent_metrics:
  affiliate_output:
    order: 1
    source_field: affiliate_output
    unit: current_million_usd
    direct_or_allocated: direct_bilateral
    derivation_status: source_direct
    formula: OECD_bilateral_affiliate_output
    use: parent_host_mp_activity
    allocation_method: none
    additive_across_parents: true
    additive_across_source_sectors: true
  affiliate_value_added:
    order: 2
    source_field: affiliate_value_added
    unit: current_million_usd
    direct_or_allocated: allocated_to_parent
    derivation_status: allocated_from_host_sector_foreign_total
    formula: host_sector_foreign_value_added_times_parent_bilateral_output_share
    use: parent_host_production_validation_with_allocation_caveat
    allocation_method: allocated_by_parent_affiliate_output_share
    additive_across_parents: true
    additive_across_source_sectors: true
  affiliate_exports:
    order: 3
    source_field: affiliate_exports
    unit: current_million_usd
    direct_or_allocated: allocated_to_parent
    derivation_status: allocated_from_host_sector_foreign_total
    formula: host_sector_foreign_exports_times_parent_bilateral_output_share
    use: parent_host_affiliate_trade_with_allocation_caveat
    allocation_method: allocated_by_parent_affiliate_output_share
    additive_across_parents: true
    additive_across_source_sectors: true
  affiliate_imports:
    order: 4
    source_field: affiliate_imports
    unit: current_million_usd
    direct_or_allocated: allocated_to_parent
    derivation_status: allocated_from_host_sector_foreign_total
    formula: host_sector_foreign_imports_times_parent_bilateral_output_share
    use: parent_host_affiliate_inputs_with_allocation_caveat
    allocation_method: allocated_by_parent_affiliate_output_share
    additive_across_parents: true
    additive_across_source_sectors: true
  parent_affiliate_output_share:
    order: 5
    source_field: parent_affiliate_output_share
    unit: fraction
    direct_or_allocated: derived_from_direct_bilateral_output
    derivation_status: derived_allocation_weight
    formula: affiliate_output_divided_by_sum_bilateral_affiliate_output_over_foreign_parents
    use: allocation_provenance_and_parent_output_composition
    allocation_method: bilateral_output_share
    additive_across_parents: false
    additive_across_source_sectors: false
  affiliate_employment:
    order: 6
    source_field: affiliate_employment
    unit: unavailable
    direct_or_allocated: unavailable
    derivation_status: source_not_available
    formula: unavailable_in_downloaded_analytical_amne_files
    use: prohibited_as_zero_or_imputed_value
    allocation_method: unavailable
    additive_across_parents: false
    additive_across_source_sectors: false

host_metrics:
  bilateral_affiliate_output_sum:
    order: 1
    unit: current_million_usd
    direct_or_allocated: derived_sum_of_direct_bilateral
    derivation_status: parent_sum_then_analysis_sector_sum
    formula: sum_affiliate_output_over_all_foreign_parents_and_eligible_source_sectors
    use: parent_share_denominator_and_source_reconciliation
    additive_across_source_sectors: true
  foreign_affiliate_output_total:
    order: 2
    unit: current_million_usd
    direct_or_allocated: direct_host_sector_total
    derivation_status: source_direct_then_analysis_sector_sum
    formula: sum_xvem_foreign_affiliate_output_total_over_eligible_source_sectors
    use: foreign_affiliate_activity_level
    additive_across_source_sectors: true
  foreign_affiliate_value_added_total:
    order: 3
    unit: current_million_usd
    direct_or_allocated: reconstructed_from_allocated_parent_cells
    derivation_status: allocated_parent_sum_then_analysis_sector_sum
    formula: sum_allocated_parent_affiliate_value_added_over_all_parents_and_eligible_source_sectors
    use: production_validation_with_allocation_provenance
    additive_across_source_sectors: true
  foreign_affiliate_exports_total:
    order: 4
    unit: current_million_usd
    direct_or_allocated: reconstructed_from_allocated_parent_cells
    derivation_status: allocated_parent_sum_then_analysis_sector_sum
    formula: sum_allocated_parent_affiliate_exports_over_all_parents_and_eligible_source_sectors
    use: foreign_affiliate_trade_level_with_allocation_provenance
    additive_across_source_sectors: true
  foreign_affiliate_imports_total:
    order: 5
    unit: current_million_usd
    direct_or_allocated: reconstructed_from_allocated_parent_cells
    derivation_status: allocated_parent_sum_then_analysis_sector_sum
    formula: sum_allocated_parent_affiliate_imports_over_all_parents_and_eligible_source_sectors
    use: foreign_affiliate_input_level_with_allocation_provenance
    additive_across_source_sectors: true
  gross_output:
    order: 6
    unit: current_million_usd
    direct_or_allocated: direct_host_sector_total
    derivation_status: source_direct_then_analysis_sector_sum
    formula: sum_xvem_gross_output_over_eligible_source_sectors
    use: host_production_denominator
    additive_across_source_sectors: true
  foreign_affiliate_output_share:
    order: 7
    unit: fraction
    direct_or_allocated: derived_ratio_of_direct_host_totals
    derivation_status: ratio_of_analysis_sector_sums
    formula: foreign_affiliate_output_total_divided_by_gross_output_when_gross_output_positive
    use: foreign_affiliate_intensity_and_scenario_b_discipline
    additive_across_source_sectors: false

