sample:
  expected_connector_count: 13
  expected_sector_count: 7
  expected_connector_sector_rows: 91
  expected_years: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  keep_all_connector_sector_cells: true
  outcome_based_selection_applied: false
  top_rank_filter_applied: false
  complete_case_filter_applied: false
  ranking_variables_constructed: false
  production_variables_included: false
  sensitivity_variables_constructed: true

time_window_sensitivity:
  base_period:
    source_key: pre_period
    start: 2014
    end: 2017
  reference_spec: primary_post
  specifications:
    primary_post:
      order: 1
      comparison_period: post
      start: 2020
      end: 2024
      rationale: Main M3.2 post window.
    exclude_2024:
      order: 2
      comparison_period: post_excluding_2024
      start: 2020
      end: 2023
      rationale: Required robustness because 2024 is both the data boundary and a Section 301 review year.
    shock_only:
      order: 3
      comparison_period: tariff_shock
      start: 2018
      end: 2019
      rationale: Tests whether the direction was already visible during the initial tariff-shock window.
  flows:
    china_to_connector:
      order: 1
      annual_value_field: china_to_connector_value_usd
      annual_excluded_value_field: china_to_connector_excluded_value_usd
      annual_source_row_count_field: china_to_connector_value_usd_row_count
      common_pre_field: china_input_value_usd_pre
      common_post_field: china_input_value_usd_post
      common_change_field: china_input_gain_usd
      common_dh_field: china_input_dh_growth_raw
      common_log_field: china_input_log_growth_raw
      common_benchmark: false
    east_asia_to_connector:
      order: 2
      annual_value_field: east_asia_to_connector_value_usd
      annual_excluded_value_field: east_asia_to_connector_excluded_value_usd
      annual_source_row_count_field: east_asia_to_connector_value_usd_row_count
      common_pre_field: east_asia_input_value_usd_pre
      common_post_field: east_asia_input_value_usd_post
      common_change_field: east_asia_input_gain_usd
      common_dh_field: east_asia_input_dh_growth_raw
      common_log_field: east_asia_input_log_growth_raw
      common_benchmark: false
    connector_to_usa:
      order: 3
      annual_value_field: connector_to_usa_value_usd
      annual_excluded_value_field: connector_to_usa_excluded_value_usd
      annual_source_row_count_field: connector_to_usa_value_usd_row_count
      common_pre_field: connector_us_value_usd_pre
      common_post_field: connector_us_value_usd_post
      common_change_field: connector_us_gain_usd
      common_dh_field: connector_export_dh_growth_raw
      common_log_field: connector_export_log_growth_raw
      common_benchmark: false
    china_to_usa:
      order: 4
      annual_value_field: china_to_usa_value_usd
      annual_excluded_value_field: china_to_usa_excluded_value_usd
      annual_source_row_count_field: china_to_usa_value_usd_row_count
      common_pre_field: china_us_value_usd_pre
      common_post_field: china_us_value_usd_post
      common_decline_field: china_us_decline_usd
      common_benchmark: true
  formulas:
    window_level: arithmetic_mean_of_annual_values
    included_value_share: sum_eligible_divided_by_sum_eligible_plus_excluded
    level_change: comparison_annual_mean_minus_pre_annual_mean
    dh_growth: two_times_change_divided_by_sum_of_comparison_and_pre
    log_growth: log_comparison_minus_log_pre_only_when_both_strictly_positive
    annual_growth_sd: sample_sd_ddof_1_of_consecutive_within_comparison_window_dh_growth
    positive_growth_year_share: positive_consecutive_level_changes_divided_by_available_comparison_transitions
    two_zero_endpoints: dh_and_log_missing
    one_zero_endpoint: dh_plus_or_minus_two_and_log_missing

source_bloc_sensitivity:
  reference_spec: china_only
  comparison_is_nested: true
  specifications:
    china_only:
      order: 1
      country_group_path: [source_bloc, core]
      expected_members: [CHN]
      field_prefix: china
    extended_east_asia:
      order: 2
      country_group_path: [source_bloc, extended_east_asia]
      expected_members: [CHN, KOR, JPN, TWN]
      field_prefix: east_asia
  self_trade_rule: exclude_connector_origin_from_source_sum_when_connector_is_a_configured_source_member
  interpretation_rule: extended_east_asia_contains_china_so_level_difference_is_the_non_china_east_asia_increment_not_an_independent_sample

exposure_definition_sensitivity:
  definitions:
    tariff_overlap:
      order: 1
      label: Tariffed-product export value share
      measure_basis: connector_export_value_share_on_tariffed_products
      threshold_rule: post_tariff_status_mean_strictly_greater_than_zero
      supports_pre_post_comparison: true
      uses_positive_export_gain_denominator: false
      measure_pre_field: connector_export_tariff_overlap_pre
      measure_post_field: connector_export_tariff_overlap_post
      measure_change_field: connector_export_tariff_overlap_change
      numerator_pre_field: connector_export_tariffed_value_usd_pre
      denominator_pre_field: connector_us_value_usd_pre
      numerator_post_or_gain_field: connector_export_tariffed_value_usd_post
      denominator_post_or_gain_field: connector_us_value_usd_post
      coverage_pre_constant: 1.0
      coverage_post_or_gain_constant: 1.0
      threshold_value_constant: 0.0
      measure_unit: share_0_1
      measure_value_basis: post_level
    exposure_weighted_rate:
      order: 2
      label: Export-value-weighted continuous exposure rate
      measure_basis: connector_export_value_weighted_policy_rate_on_observed_exposure_products
      threshold_rule: continuous_product_exposure_rate
      supports_pre_post_comparison: true
      uses_positive_export_gain_denominator: false
      measure_pre_field: connector_export_exposure_weighted_pre
      measure_post_field: connector_export_exposure_weighted_post
      measure_change_field: connector_export_exposure_weighted_change
      numerator_pre_field: connector_export_exposure_numerator_usd_pre
      denominator_pre_field: exposure_observed_export_value_usd_pre
      numerator_post_or_gain_field: connector_export_exposure_numerator_usd_post
      denominator_post_or_gain_field: exposure_observed_export_value_usd_post
      coverage_pre_field: connector_export_exposure_observed_value_share_pre
      coverage_post_or_gain_field: connector_export_exposure_observed_value_share_post
      threshold_value_missing: true
      measure_unit: ad_valorem_rate
      measure_value_basis: post_level
    positive_exposure_gain_share:
      order: 3
      label: Positive export gain share on products with exposure above zero
      measure_basis: positive_export_gain_share_on_positive_exposure_products
      threshold_rule: observed_product_exposure_strictly_greater_than_zero
      supports_pre_post_comparison: false
      uses_positive_export_gain_denominator: true
      measure_value_field: gain_in_positive_exposure_products_share
      numerator_post_or_gain_field: connector_export_positive_gain_in_positive_exposure_usd
      denominator_post_or_gain_field: connector_export_positive_gain_exposure_observed_usd
      coverage_post_or_gain_field: connector_export_positive_gain_exposure_observed_share
      threshold_value_constant: 0.0
      measure_unit: share_0_1
      measure_value_basis: positive_export_gain
    top_quartile_exposure_gain_share:
      order: 4
      label: Positive export gain share on sector top-quartile exposure products
      measure_basis: positive_export_gain_share_on_sector_positive_exposure_p75_products
      threshold_rule: sector_positive_observed_exposure_linear_type7_p75
      supports_pre_post_comparison: false
      uses_positive_export_gain_denominator: true
      measure_value_field: gain_in_top_quartile_exposure_products_share
      numerator_post_or_gain_field: connector_export_positive_gain_in_top_quartile_exposure_usd
      denominator_post_or_gain_field: connector_export_positive_gain_exposure_observed_usd
      coverage_post_or_gain_field: connector_export_positive_gain_exposure_observed_share
      threshold_value_field: sector_positive_exposure_p75_cutoff
      measure_unit: share_0_1
      measure_value_basis: positive_export_gain
  comparison_rule: definitions_have_different_estimands_and_units_so_no_cross_definition_numeric_difference_or_rank_is_constructed_in_m3_6

